# Meta-Verify Configuration: Collaboration Signals
# NEW in v2.0.0 Enhanced
# Defines how meta-verify scores collaboration readiness across three dimensions:
# 1. Ownership Clarity (15 pts) — is the maintainer/owner explicit?
# 2. Skill-Shareability (15 pts) — can this be pushed to GitHub?
# 3. Learnings Hooks (15 pts) — does meta-learn have a hook?
#
# Plus integration with Emily Kramer's 4 Cs framework

version: 2.0.0
framework: "Pawel Huryn + 2026 GTM Adoption Lens + Emily Kramer 4 Cs (Claude, Context, Capabilities, Collaboration)"

---

## Part 1: Ownership Clarity Scoring (15 pts max)

# Ownership clarity answers: "Who maintains this? Who's responsible if it breaks?"
# Low ownership → hard to share (who do you escalate to?)
# High ownership → team can adopt confidently (clear escalation path)

ownership_clarity:
  scoring:
    15:
      description: "Owner explicitly named, handoff date clear, maintenance plan included"
      signals:
        - owner_name_explicit: true              # "Sarah (Content Marketing)"
        - owner_contact: true                    # Email or Slack handle included
        - handoff_date: true                     # "2026-08-15" or "quarterly review"
        - maintenance_frequency: true             # "Update every 30 days" or "quarterly"
        - escalation_path: true                  # "If Sarah unavailable, escalate to Director X"
      example: |
        Owner: Sarah Chen (sarah@company.com, #content-marketing)
        Handoff Date: 2026-08-15
        Maintenance: Quarterly review, update if messaging changes
        Escalation: Marketing Director, James Wu

    10:
      description: "Owner identified, handoff somewhat clear, maintenance vague"
      signals:
        - owner_name_explicit: true
        - handoff_date: true
        - maintenance_frequency: false
        - escalation_path: false
      example: |
        Owner: Sarah (knows how this works)
        Handoff Date: "Eventually, depends on timeline"
        Maintenance: [Not specified]

    5:
      description: "Owner unclear or implicit, no handoff plan"
      signals:
        - owner_name_explicit: false
        - owner_context_only: true               # "The person who built this knows"
      example: |
        Owner: [Whoever built it in Claude]
        Handoff: [Not discussed]

    0:
      description: "No ownership signal, output looks like a one-off"
      signals:
        - orphaned: true                         # No clear owner
        - maintenance_plan_absent: true

  patterns_to_watch:
    high_adoption_ownership: "When owner is explicit + escalation clear → 90%+ adoption by week 2"
    adoption_blocker: "When owner unclear → team members build their own instead of adopting"
    team_learnings: "Skills with rotating ownership (pass from Sarah → James) show 15% lower adoption than single-owner skills"

---

## Part 2: Skill-Shareability Scoring (15 pts max)

# Skill-shareability answers: "Can this be pushed to GitHub without rework?"
# Low shareability → requires rework before team can use (undocumented, no tests, unclear interface)
# High shareability → push as-is, team adopts immediately (modular, evals exist, interface clear)

skill_shareability:
  scoring:
    15:
      description: "Modular, evals exist, interface crystal clear, ready for GitHub"
      signals:
        - is_modular: true                       # Can be used independently
        - has_evals: true                        # 3+ test cases defined
        - inputs_documented: true                # Clear input schema
        - outputs_documented: true               # Clear output schema
        - dependencies_listed: true              # "Requires meta-review output"
        - setup_instructions: true               # "1. Copy to /skills/, 2. Load config"
      example: |
        Modular: YES (works standalone or as part of GTM workflow)
        Evals: 5 test cases (positioning_bold, messaging_incremental, adoption_curve, etc.)
        Inputs: Skill output (markdown), meta-review score (int), tier (T1-T4)
        Outputs: Confidence (int), scope_recommendation (string), next_action (string)
        Setup: Copy file → Update config/confidence-model.yml → Run evals

    10:
      description: "Mostly modular, evals partial, interface mostly clear, minor rework needed"
      signals:
        - is_modular: true
        - has_evals: true                        # 1-2 test cases
        - inputs_documented: true
        - outputs_documented: false              # One output needs clarification
      example: |
        Modular: YES
        Evals: 2 test cases (happy path + error case)
        Inputs: Clear
        Outputs: Mostly clear, one field needs documentation
        Rework: 15 min to document last output field

    5:
      description: "Works but would need refactor to share, unclear interface"
      signals:
        - is_monolithic: true                    # Tightly coupled to specific use case
        - hard_to_separate: true
        - has_evals: false
        - interface_unclear: true
      example: |
        Modular: NO (tightly coupled to Sarah's GTM brief workflow)
        Evals: None
        Interface: Unclear how to use outside GTM context
        Rework: 2-3 hours to make generic + add evals

    0:
      description: "Too custom, not skill-shareable, lives in one person's notebook"
      signals:
        - single_use: true
        - not_documented: true
        - evals_absent: true

  patterns_to_watch:
    adoption_if_shareable: "When skill is shareable (15/15) → 80%+ adoption rate"
    adoption_if_needs_rework: "When skill needs rework (5-10/15) → 30-40% adoption rate"
    rework_risk: "Skills pushed without evals fail in 60% of downstream use cases"
    team_learnings: "Modular skills with clear evals unlock 3x more downstream skills than monolithic skills"

  best_practices:
    - "Always define inputs/outputs as schema (YAML, JSON, or Markdown table)"
    - "Include 3+ evals before pushing to GitHub"
    - "Make skills generic, not workflow-specific"
    - "Document setup: 'Copy → Update config → Done'"

---

## Part 3: Learnings Hooks Scoring (15 pts max)

# Learnings hooks answer: "Does meta-learn have a clear way to consume this output?"
# Low hooks → output doesn't feed back into the compounding loop
# High hooks → learnings compound (meta-learn confirms/contradicts hypotheses, quality-learnings update)

learnings_hooks:
  scoring:
    15:
      description: "Meta-learn hook clear, learnings will compound, structure consistent"
      signals:
        - extractable_patterns: true             # "Positioning clarity" is a pattern meta-learn can track
        - quality_learnings_field: true          # Output includes "what worked", "what didn't", "what to watch"
        - structured_output: true                # JSON/YAML, not freeform text
        - references_previous_learnings: true    # "Based on prior patterns, we recommend X"
        - updates_brain_sections: true           # Will update /foundation/brain.md Sections 2, 5, 7
      example: |
        Pattern: "Positioning ownership (unique value clarity test)"
        Meta-learn hook: `quality_learnings.positioning_ownership = output.pawel_rigor_score`
        Compounding: "When positioning_ownership > 15/20, success rate = 82%"
        Brain update: Section 7 (Meta-Learnings) logs "Unique value clarity drives 82% success rate"

    10:
      description: "Meta-learn hook present, learnings likely, structure mostly consistent"
      signals:
        - extractable_patterns: true
        - learnings_partial: true                # Some learnings captured, not all
        - structured_output: true
        - references_previous_learnings: false   # Doesn't yet reference prior patterns
      example: |
        Pattern: "Messaging clarity"
        Meta-learn hook: Partial (hook exists for clarity, not for all dimensions)
        Compounding: "Learnings will flow, but could be richer"

    5:
      description: "Possible hook but would require adaptation, patterns not obvious"
      signals:
        - learnings_hidden: true                 # Learnings buried in prose
        - unstructured_output: true              # Freeform text instead of schema
        - meta_learn_would_need_to_parse: true   # Meta-learn would need NLP to extract
      example: |
        Pattern: Buried in output prose ("The key thing we noticed was...")
        Meta-learn hook: Would need to NLP-extract meaning
        Rework: Restructure into learnings schema

    0:
      description: "No hook, output is terminal (doesn't feed back into learning system)"
      signals:
        - terminal_output: true                  # Quality score only, no patterns
        - no_learnings_field: true
        - not_consumable_by_meta_learn: true
      example: |
        Output: "Confidence: 72%"
        That's all. No learnings to compound.

  patterns_to_watch:
    compounding_effect: "When learnings hooks clear (15/15) → system learning speed increases 3x"
    orphaned_learnings: "Outputs without hooks create 'learning debt' (insights captured but not compounded)"
    meta_learn_feedback: "Meta-learn tracks which outputs fed learnings; high-quality learnings-hook outputs become templates for future skills"
    team_learnings: |
      After 30 days: Skills with strong hooks (15/15) show:
        - Quality scores improve 2-3 pts/month (learnings compound)
        - Execution team awareness of patterns increases
        - Future skills reference prior patterns (+1.5 pts on first run)

  learnings_schema:
    # Recommend this structure for all outputs:
    what_worked:
      type: array
      items: string
      description: "What patterns/approaches succeeded"
      example: ["Positioning with unique value angle", "CS handoff date explicit"]

    what_didnt_work:
      type: array
      items: string
      description: "What patterns/approaches failed"
      example: ["Generic positioning", "Vague enablement timeline"]

    what_to_watch:
      type: array
      items: string
      description: "Patterns to monitor going forward"
      example: ["Messaging clarity affects adoption by ~10%", "Sales ramp timing matters"]

    confidence_deltas:
      type: object
      description: "How each factor affected success probability"
      example:
        positioning_clarity: +8
        sales_ramp_explicit: +5
        messaging_hit: -3

---

## Part 4: Collaboration Integration (Emily Kramer 4 Cs)

# How meta-verify's collaboration scoring maps to Emily Kramer's multiplayer Claude framework:
# - Claude (Harness): Meta-verify runs in Claude Code/Cowork
# - Context: Assesses if output references live data, updates /foundation/brain.md
# - Capabilities: Scores skill-shareability, evals, modular design
# - Collaboration: Scores ownership clarity, learnings hooks, multiplayer adoption

collaboration_maturity_model:
  level_1: "Single-player skills (high-quality but not team-shareable)"
    score_range: "0-30 collaboration readiness"
    characteristics:
      - "Ownership unclear or implicit"
      - "Skills not modular or evals missing"
      - "Learnings not captured for compounding"
    adoption_rate: "< 20% team adoption"
    example: "Skill buried in one person's Claude notebook"

  level_2: "Shared skills (pushed to GitHub but low adoption)"
    score_range: "31-60 collaboration readiness"
    characteristics:
      - "Owner identified but handoff vague"
      - "Skill mostly shareable but needs rework"
      - "Some learnings hooks, but not all"
    adoption_rate: "20-50% team adoption"
    example: "Skill pushed to repo, but only creator uses it (others find it unclear)"

  level_3: "Multiplayer skills (high adoption, compounding learnings)"
    score_range: "61-85 collaboration readiness"
    characteristics:
      - "Owner explicit, handoff clear"
      - "Skill shareable, evals strong"
      - "Learnings hooks present and feeding back"
    adoption_rate: "50-80% team adoption"
    example: "Skill hits 8+ users in week 2, unlocks 2+ downstream skills"

  level_4: "Self-improving system (full compounding loop active)"
    score_range: "86-100 collaboration readiness"
    characteristics:
      - "Ownership + handoff + escalation crystal clear"
      - "Highly modular, comprehensive evals"
      - "Strong learnings hooks, team knowledge compounds"
      - "Multiple versions exist (forked, adapted, specialized)"
    adoption_rate: "> 80% team adoption"
    example: |
      Core skill (meta-review) spawned:
        - meta-review-for-positioning (specialized)
        - meta-review-for-gtm-briefs (customized)
        - meta-review-for-sales-enablement (adapted)
      All updated in sync via shared patterns.

---

## Part 5: Calibration Signals (New)

# Track collaboration readiness predictions vs. actual adoption outcomes
# Similar to how confidence model improves, collaboration model calibrates over time

collaboration_calibration:
  tracking_period: "30-90 days"

  metrics_to_track:
    predicted_reach:
      type: "int"
      definition: "Number of team members predicted to use this skill"
      example: 8

    actual_adoption_week_2:
      type: "int"
      definition: "How many actually used it by week 2"
      example: 7

    actual_adoption_week_4:
      type: "int"
      definition: "How many used it by week 4 (steady state)"
      example: 8

    adoption_gap:
      type: "string"
      definition: "Predicted reach vs. actual (over/under)"
      example: "-1 (predicted 8, got 7)"

    rework_needed:
      type: "bool"
      definition: "Did adopters request changes?"
      example: true

    downstream_skills_enabled:
      type: "int"
      definition: "How many other skills built on top of this"
      example: 3

  calibration_signals:
    over_prediction: "When predicted reach > actual by 3+ → collaboration scoring may be too optimistic"
    under_prediction: "When predicted reach < actual → collaboration scoring conservative"
    adoption_blockers: "High-quality skills with low adoption → investigate ownership clarity, learnings hooks"
    multiplier_validation: "Skills that enable 3+ downstream skills → increase skill_multiplier score in future similar outputs"

---

## Part 6: Anti-Patterns (What NOT to Score High)

anti_patterns:
  false_high_collaboration_score:
    - "Skill is beautiful but doesn't update quality-learnings.md (high score but won't compound)"
    - "Owner named but unavailable (will cause adoption cliff when owner leaves)"
    - "Evals exist but don't test real-world use cases (false sense of shareability)"
    - "Modular on paper but coupled to one team's workflow (won't generalize)"

  red_flags:
    - "Collaboration score 80+ but quality score <70 (won't be adopted, collaboration high for wrong reasons)"
    - "Learnings hooks claim strong but quality-learnings.md unchanged (promise without delivery)"
    - "Ownership explicit but owner leaving soon (time bomb)"
    - "Skill marketed as 'team-ready' but no evals run (false confidence)"

