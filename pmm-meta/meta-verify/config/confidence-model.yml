# Meta-Verify Configuration: Confidence Model (Enhanced with Collaboration)
# v2.0.0 Extended
#
# Predicts success probability for skill outputs
# Base model: Quality score + Tier + Guardrails + Team capability
# Enhanced model: + Collaboration readiness (ownership, shareability, learnings hooks)
#
# Framework: Pawel Huryn + 2026 GTM Adoption Lens + Emily Kramer 4 Cs

version: 2.0.0
framework: "Confidence prediction with collaboration weighting"

---

## Part 1: Base Confidence Model (By Tier)

# These are historical averages + calibrated ranges
# Updated weekly as meta-verify accumulates more data

base_confidence_by_tier:
  T1_launch:
    base_confidence: 80                         # T1s succeed ~80% of the time
    minimum_quality_score: 90
    quality_adjustment_threshold: 85            # Score >85 gets bonus
    range: "75-85%"                             # Realistic band for T1
    sample_size: 12                             # Data points used to calibrate
    calibration_status: "STABLE"
    notes: |
      T1 = big bets (product launch, major GTM overhaul, new market)
      Higher quality requirements, but when met, success rate is high
      Requires: Clear ownership, strong team, no guardrails hit

  T2_launch:
    base_confidence: 70
    minimum_quality_score: 75
    quality_adjustment_threshold: 80
    range: "60-80%"
    sample_size: 18
    calibration_status: "STABLE"
    notes: |
      T2 = medium bets (new feature, new segment, campaign refresh)
      More forgiving than T1, still solid quality bar
      Moderate guardrail hits acceptable (1-2 max)

  T3_launch:
    base_confidence: 55
    minimum_quality_score: 60
    quality_adjustment_threshold: 70
    range: "45-65%"
    sample_size: 8
    calibration_status: "LIMITED_DATA"
    notes: |
      T3 = small tests (new messaging, small campaign, internal project)
      Low bar, high variance (quality matters less)
      Should have guardrail hits (exploratory by nature)

  T4_launch:
    base_confidence: 40
    minimum_quality_score: 50
    quality_adjustment_threshold: 60
    range: "30-50%"
    sample_size: 2
    calibration_status: "INSUFFICIENT_DATA"
    notes: |
      T4 = experimental (one-offs, tests, side projects)
      Very low bar, highly variable
      Not recommended for major decisions

---

## Part 2: Quality Score Adjustments

# How quality scores affect confidence prediction
# Base + Quality adjustment + Guardrail penalty + Team bonus + Collaboration bonus = Final

quality_adjustments:
  # If quality score > threshold, get bonus
  tier_T1:
    threshold: 85
    scoring:
      90_100:
        adjustment: +5
        label: "Excellent (90-100)"
        description: "Rare high-quality T1 output, boost confidence"

      85_89:
        adjustment: +2
        label: "Good (85-89)"
        description: "Meets T1 quality bar, no adjustment needed"

      75_84:
        adjustment: -8
        label: "Borderline (75-84)"
        description: "Below T1 minimum, risk increases significantly"

      below_75:
        adjustment: -15
        label: "Poor (<75)"
        description: "Below quality bar, block or fix before launch"

  tier_T2:
    threshold: 75
    scoring:
      85_100:
        adjustment: +5
        label: "Excellent (85-100)"

      80_84:
        adjustment: +3
        label: "Good (80-84)"

      75_79:
        adjustment: +1
        label: "Acceptable (75-79)"

      70_74:
        adjustment: -3
        label: "Below bar (70-74)"

      below_70:
        adjustment: -8
        label: "Poor (<70)"

  tier_T3:
    threshold: 60
    scoring:
      70_100:
        adjustment: +3
        label: "Good (70+)"

      60_69:
        adjustment: 0
        label: "Acceptable (60-69)"

      below_60:
        adjustment: -5
        label: "Poor (<60)"

  tier_T4:
    threshold: 50
    scoring:
      60_100:
        adjustment: +2
        label: "Good (60+)"

      50_59:
        adjustment: 0
        label: "Acceptable (50-59)"

      below_50:
        adjustment: -3
        label: "Poor (<50)"

---

## Part 3: Guardrail Penalties

# Each guardrail hit reduces confidence (Pawel + adoption lens enforcement)

guardrail_penalties:
  positioning_clarity:
    penalty: -3
    reason: "Positions that don't own unique value tend to underperform"
    source: "Pawel Huryn framework"
    recurrence_rate: "45% of T2 briefs hit this"

  enablement_timing:
    penalty: -2
    reason: "Pre-launch enablement correlates with 20% higher velocity"
    source: "2026 GTM adoption lens"
    recurrence_rate: "30% of launches"

  cs_handoff_clarity:
    penalty: -2
    reason: "Unclear CS handoff = slower expansion velocity"
    source: "2026 GTM adoption lens"
    recurrence_rate: "40% of launches"

  cross_functional_alignment:
    penalty: -3
    reason: "Misaligned teams = rework + delays"
    source: "2026 GTM adoption lens"
    recurrence_rate: "25% of launches"

  sales_ramp_unrealistic:
    penalty: -4
    reason: "Unrealistic curves fail early and hard"
    source: "2026 GTM adoption lens"
    recurrence_rate: "35% of briefs"

  # Cumulative penalty cap
  cumulative_penalty_cap: -12  # Don't exceed -12% total penalty (even if 4+ guardrails hit)

  notes: |
    Penalties compound: 2 guardrails = -5% to -6% (not -7)
    Hitting >2 guardrails flags "block or fix before launch"
    Each guardrail addressed in meta-review fixes reduces this penalty

---

## Part 4: Team Capability Bonus (New in v2.0.0)

# How execution team's track record affects confidence

team_capability:
  strong_track_record:
    bonus: +3
    criteria:
      - "Team has 5+ launches in past 90 days"
      - "Average quality score trending up (1+ pt/month)"
      - "Team has delivered T1 before with >80% success"
    notes: "Experienced teams execute better, get higher confidence"

  moderate_track_record:
    bonus: 0
    criteria:
      - "Team has 2-4 launches"
      - "Quality scores stable"
      - "New to T1, but strong on T2"

  weak_track_record:
    bonus: -3
    criteria:
      - "Team has <2 launches"
      - "Quality scores below average"
      - "First time with this tier"
    notes: "New/weak teams get penalty, need more guardrails, closer monitoring"

  track_record_recency:
    decay_rate: "Bonus decays 0.5% per week if no launches"
    example: "+3 bonus → +2.5 after 1 week idle, +2 after 2 weeks, etc."
    reset: "Any launch resets the bonus clock"

---

## Part 5: Collaboration Bonus (NEW - Emily Kramer 4 Cs)

# How collaboration readiness affects confidence
# High collaboration → skill will scale, more team involvement → higher success
# Low collaboration → single-player risk, will fail if creator leaves

collaboration_confidence_bonus:
  threshold_score: 45                          # Out of 45 possible collaboration points

  scoring:
    high_collaboration:
      range: "35-45 (78-100%)"
      bonus: +3
      interpretation: |
        Ownership clear + Skill shareable + Learnings will compound
        Team will adopt and improve this over time
        Success compounds as team learns
      example: "GTM brief with explicit owner, clear evals, learnings hook → +3 bonus"

    moderate_collaboration:
      range: "25-34 (55-77%)"
      bonus: +1
      interpretation: |
        Mostly shareable, learnings hook present but weak
        Team will probably adopt, but rework may be needed
        Success depends on team effort post-launch

    low_collaboration:
      range: "15-24 (33-54%)"
      bonus: 0
      interpretation: |
        Not readily shareable, minimal learnings hooks
        Success depends entirely on creator execution
        Will stall if creator moves to other projects

    orphaned:
      range: "0-14 (0-32%)"
      bonus: -3
      interpretation: |
        No clear owner, minimal collaboration signals
        High risk of failure (no team support)
        Will require significant rework for adoption
      confidence_cap: "Capped at base confidence - 5% (can't be too optimistic)"

  calibration_signals:
    correlation: "Skills with collaboration 35+ score hit 85%+ adoption; <15 score hit <20% adoption"
    adoption_per_point: "Each additional collaboration point correlates with ~2% higher adoption rate"
    team_learning_correlation: "High-collaboration skills improve quality baseline by 1.5 pts/month through learnings"

---

## Part 6: Context-Engineering Rigor Bonus (NEW)

# Does skill use live data? Does it update the knowledge base?

context_rigor_bonus:
  high_rigor:
    range: "12-15 pts"
    bonus: +2
    criteria:
      - "Pulls from 2+ MCPs (live data)"
      - "Updates /foundation/brain.md"
      - "Will become guardrail material"
    interpretation: "Skill feeds the knowledge system; future skills will reference this"

  moderate_rigor:
    range: "8-11 pts"
    bonus: +1
    criteria:
      - "Pulls from 1 MCP or uses mostly live context"
      - "Partially updates brain"

  low_rigor:
    range: "0-7 pts"
    bonus: 0
    criteria:
      - "Uses only static context"
      - "Won't update brain sections"
      - "Disconnected from knowledge system"

---

## Part 7: Confidence Calculation Formula

# Full formula for final confidence prediction

confidence_calculation:
  formula: |
    confidence = base_tier_confidence
               + quality_adjustment
               - guardrail_penalties (capped at -12)
               + team_capability_bonus
               + collaboration_bonus
               + context_rigor_bonus
               ± historical_adjustments

  example_walkthrough:
    scenario: "T2 GTM Brief, quality 78, 1 guardrail hit, strong team, high collaboration"
    calculation: |
      Base T2 confidence:                          70%
      Quality adjustment (78 > 75 threshold):      +2%
      Guardrail penalty (messaging_clarity hit):   -3%
      Team capability (strong track record):       +3%
      Collaboration bonus (78% readiness):         +3%
      Context rigor (pulls from Slack + Drive):    +1%
      ─────────────────────────────────────────
      Final confidence:                            76% ± 12%

      Recommendation: Proceed with launch (76% is acceptable for T2)
      Adoption expectation: 78% collaboration score → 7-8 team members will use this

  confidence_band:
    calculation: |
      Lower bound = final_confidence - (3% per uncertainty factor)
      Upper bound = final_confidence + (3% per uncertainty factors)

      Uncertainty factors:
        - Limited historical data (< 5 data points): ±5%
        - New team executing this tier: ±3%
        - Guardrails hit: ±2% per guardrail
        - Collaboration untested: ±2%

      Example above: 76% ± 12% = 64-88% range

    interpretation: |
      64%: Worst case (all guardrails materialize, team stumbles, adoption fails)
      76%: Expected case (normal execution, moderate adoption)
      88%: Best case (team executes well, skill adopted broadly, compounds learnings)

---

## Part 8: Scope Expansion Logic (T2 → T1 Upgrade)

# When should a T2 output be elevated to T1?

scope_expansion:
  upgrade_criteria:
    # Must meet ALL three conditions to suggest T1 upgrade
    quality_threshold: "≥ 85"
    confidence_threshold: "≥ 75%"
    collaboration_threshold: "≥ 65 (29/45 points)"  # NEW: Need collaboration readiness for T1
    time_available: "≥ 2 weeks before launch"

  decision_tree: |
    IF quality >= 85 AND confidence >= 75% AND collaboration >= 65:
      RECOMMEND: "Suggest T1 upgrade (quality + confidence + team readiness all there)"

    IF quality >= 85 AND confidence >= 75% AND collaboration < 65:
      RECOMMEND: "Stay T2 (quality good, but collaboration risk too high for T1 scope)"
      ACTION: "Fix collaboration before upgrading (clarity ownership, prep for scale)"

    IF quality >= 85 AND confidence < 75% AND collaboration >= 65:
      RECOMMEND: "Stay T2, fix guardrails first"
      ACTION: "Address guardrail, re-verify, then consider T1"

    ELSE:
      RECOMMEND: "Stay current tier"

  historical_success_rate: |
    T2 → T1 upgrades with all criteria met: 87% hit T1 targets
    T2 → T1 upgrades without collaboration readiness: 42% hit T1 targets (risky)

---

## Part 9: Calibration Tracking

# Track how well confidence model predicts over time

calibration_tracking:
  period: "30-day rolling window"

  metrics:
    prediction_accuracy:
      definition: "% of predictions within ±10% of actual outcome"
      target: ">80% accurate"
      current: "78% (improving 1% per week)"

    over_prediction:
      definition: "% of predictions that were too optimistic"
      target: "<10%"
      current: "8% (good)"
      action: "If >10%, reduce base confidence by 2-3%"

    under_prediction:
      definition: "% of predictions that were too pessimistic"
      target: "<10%"
      current: "12% (room to improve)"
      action: "If >10%, increase base confidence by 1-2%"

    model_stability:
      definition: "Are components (quality, team, collaboration) moving together?"
      target: "Stable month-over-month"
      current: "STABLE (no drift)"

  recalibration_trigger:
    - "Every 30 days review accuracy"
    - "If drift >5% in any direction, adjust base by 2-3%"
    - "If collaboration component shows bias, adjust bonus by ±1%"

---

## Part 10: Anti-Patterns

# Watch for these confidence errors

false_positives:
  - "High confidence (80%+) + Low collaboration (<40%) → Usually fails (team won't adopt)"
  - "High confidence + New team, no track record → Overconfident (use -3% penalty)"
  - "High confidence despite 3+ guardrails → Ignoring guardrails (cap penalty at -12% not working?)"

false_negatives:
  - "Low confidence (60%) + High collaboration (35+) → Usually succeeds (team carries it)"
  - "Low confidence despite strong team track record → Underweight team_capability_bonus"
  - "Low confidence but quality 85+ → Guardrail penalties too harsh?"

---

