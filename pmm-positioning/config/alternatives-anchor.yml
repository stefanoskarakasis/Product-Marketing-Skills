# PMM-Positioning Configuration: Alternatives & Status Quo Map
# Integrates alternatives analysis into positioning scoring
# Loads /foundation/brain.md Section 3 (Alternatives Map) before positioning runs

version: 2.0.0
framework: "Alternatives Framework + Positioning Rigor"

---

## Part 1: Pre-Flight: Load Brain Section 3

# When pmm-positioning runs, Step 0 loads:
#   1. Read /foundation/brain.md Section 3 (Alternatives & Status Quo Map)
#   2. Load all named alternatives (competitors + status quo)
#   3. Score positioning against each alternative

pre_flight_integration:
  brain_section_loaded: "Section 3: Alternatives & Status Quo Map"

  required_fields_in_brain:
    - named_alternatives: "List of 3-5 alternatives buyer considers (named, not generic)"
    - status_quo_baseline: "What buyer does today if they don't buy us"
    - differentiation_vs_each: "How we differ vs. each alternative"

  if_brain_section_missing:
    trigger: "hs-alternatives-map"
    message: "Alternatives map required before positioning. Building now..."

  validation:
    all_alternatives_loaded: true
    status_quo_understood: true
    differentiation_stated: true

---

## Part 2: Positioning-vs-Alternatives Validation

# For each named alternative, score: "Does our positioning own a unique angle vs this competitor?"

positioning_vs_alternatives:
  scoring_template:
    alternative_name: "Slack"
    our_positioning: "Integration-native GTM operations platform"
    their_positioning: "Unified communications hub (Slack)"
    differentiation:
      our_angle: "We focus on GTM ops complexity; they focus on comms"
      unique_to_us: "Integration-native architecture + GTM-specific templates"
      unique_to_them: "Communications network effects; enterprise integrations"
      buyer_tradeoff: "If buyer wants integrated comms: Slack wins. If buyer wants GTM ops consolidation: we win."
    positioning_clarity_vs_this_competitor: 18/20
    notes: "Position clearly owns GTM operations angle. Slack owns communications."

  validation_rules:
    rule_1: "Position should own unique angle vs. ALL named alternatives (score 15+)"
    rule_2: "If positioning is generic vs. any competitor, score ≤12 (flag for rewrite)"
    rule_3: "If positioning owns unique angle vs. all competitors, score 18+ (strong)"

  patterns_to_watch:
    owned_vs_all_alternatives: "When position owns unique angle vs. all competitors → 82% win rate"
    generic_vs_any_alternative: "When position is generic vs. even one competitor → win rate drops to 50%"

---

## Part 3: Status Quo Baseline Comparison

# How does our positioning stand vs. "do nothing" (status quo)?

status_quo_comparison:
  status_quo_option: "Continue using spreadsheets + Salesforce + Slack"
  pain_of_status_quo: "High operational complexity, manual data sync, no single source of truth"

  our_positioning_value: "Reduce go-to-market complexity by 40% via integration-native architecture"

  comparison:
    status_quo_ease_of_change: "High (already familiar)"
    our_difficulty_of_change: "Medium (requires migration, training)"
    status_quo_pain_point: "Operational complexity + manual overhead"
    our_solution_clarity: "Clear (40% reduction in complexity)"
    buyer_decision_criteria:
      pain_threshold: "Does operational complexity cost >$X/year in lost productivity?"
      our_win_condition: "If pain > X, our positioning wins"

  positioning_clarity_vs_status_quo:
    score: 19/20
    notes: "Clear value vs. doing nothing. Status quo is understood as baseline."

---

## Part 4: Five Core Questions Applied

# Positioning must answer these five questions clearly:

five_core_questions:
  question_1_target_buyer:
    label: "Who is the target buyer?"
    required: "Buyer persona named (from brain Section 2: ICP)"
    example: "Mid-market ops leaders (50-500 people, $500K-5M tech budget)"
    validation: "ICP is explicit in positioning"

  question_2_problem:
    label: "What problem do they have?"
    required: "Specific problem (not generic)"
    example: "GTM complexity kills growth velocity (not: 'we want efficiency')"
    validation: "Problem statement is resonant (score 12+ on resonance dimension)"

  question_3_alternative:
    label: "What would they do instead?"
    required: "Named alternative (from brain Section 3: Alternatives Map)"
    example: "Continue with spreadsheets + Salesforce + Slack (status quo)"
    validation: "All named alternatives loaded from brain"

  question_4_unique_value:
    label: "Why are we uniquely suited to solve this?"
    required: "Unique angle (not features, not hype)"
    example: "Integration-native architecture means no data silos (we own this, competitors don't)"
    validation: "Positioning clarity 15+ (owned angle, not generic)"

  question_5_reason_to_believe:
    label: "Why should they believe us?"
    required: "Proof point or company signal"
    example: "Built by former platform architects; adopted by 10+ mid-market GTM teams"
    validation: "Proof points from brain Section 6 included"

  validation_gate:
    all_five_questions_answered: true            # If any missing, flag for positioning rewrite
    questions_explicit_in_positioning: true

---

## Part 5: Competitive Positioning Matrix

# Score positioning against each competitor on key dimensions

competitive_matrix:
  dimensions:
    - integration_native                          # Your unique advantage
    - gtm_specificity                             # Your specific focus vs. generic
    - ease_of_use                                 # Competitor strength
    - existing_ecosystem                          # Competitor strength
    - switching_cost                              # Competitor advantage (inertia)

  example_matrix:
    your_product:
      integration_native: 9/10                    # Owned angle
      gtm_specificity: 9/10                       # Owned angle
      ease_of_use: 7/10                           # Competitive
      existing_ecosystem: 5/10                    # Weakness
      switching_cost: 3/10                        # Weakness (new)

    competitor_1:
      integration_native: 4/10
      gtm_specificity: 1/10                       # Weakness
      ease_of_use: 9/10                           # Strength
      existing_ecosystem: 9/10                    # Strength
      switching_cost: 9/10                        # Strength

    competitor_2:
      integration_native: 5/10
      gtm_specificity: 2/10                       # Weakness
      ease_of_use: 5/10
      existing_ecosystem: 9/10
      switching_cost: 8/10

  positioning_implication:
    your_advantage: "Own integration + GTM specificity (top-left quadrant)"
    competitor_advantage: "Own ease of use + ecosystem + switching cost (right side)"
    positioning_angle: "For buyers who prioritize GTM operations consolidation over ecosystem breadth, you win"

  positioning_clarity_vs_matrix:
    rule: "Positioning should clearly own at least 2 dimensions competitors don't"
    example: "You own (integration_native + gtm_specificity); competitors own (ecosystem + ease_of_use)"
    score: 18/20 (clear tradeoff articulated)

---

## Part 6: Meta-Verify Integration

# How does this alternatives anchor affect confidence prediction?

meta_verify_adjustments:
  positioning_clarity_guardrail:
    rule: "If positioning doesn't own angle vs. all named alternatives → -3% confidence penalty"
    example: "If position is generic vs. competitor → meta-verify marks this as guardrail hit"

  competitive_positioning_bonus:
    rule: "If position owns 2+ dimensions competitors don't → +2% confidence bonus"
    example: "Own (integration + GTM spec) → +2% to confidence prediction"

  confidence_impact_calculation:
    base_t2_confidence: 70
    positioning_clarity_guardrail: -3            # If positioning is generic
    competitive_positioning_bonus: +2            # If position owns 2+ dimensions
    adjusted_confidence: 69

---

## Part 7: Guardrail Proposal (Meta-Synthesis)

# When pmm-positioning runs with clear alternatives anchor, what guardrails should be proposed?

proposed_guardrails:
  guardrail_1:
    name: positioning_must_own_angle_vs_alternatives
    strength: HIGH                                # Cross-skill signal (appears in 3+ GTM workflows)
    trigger: "When positioning doesn't own unique angle vs. all named alternatives"
    penalty: -3                                   # Confidence penalty in meta-verify
    remediation: "Reposition to own a clear angle competitors don't claim"
    automation: "meta-review automatically loads this before scoring"

  guardrail_2:
    name: alternatives_map_required_for_positioning
    strength: MEDIUM                              # Emerging pattern
    trigger: "When alternatives map not explicitly loaded from brain"
    penalty: -2
    remediation: "Build alternatives map first, then run positioning"

  guardrail_3:
    name: status_quo_comparison_must_be_explicit
    strength: MEDIUM
    trigger: "When positioning doesn't compare vs. status quo baseline"
    penalty: -2
    remediation: "Add explicit status quo comparison to positioning"

---

## Part 8: Brain Section Dependencies

# pmm-positioning reads and writes these brain sections

brain_dependencies:
  reads_section_2: "ICP (target buyer persona)"
  reads_section_3: "Alternatives & Status Quo Map"
  reads_section_6: "Proof Points & Claims (for reason-to-believe)"
  writes_section_5: "Positioning & Messaging (updates with new positioning)"
  writes_section_7: "Meta-Learnings (logs positioning clarity pattern)"

  validation:
    all_reads_present: true                       # If any missing, trigger prerequisite skill
    writes_logged_for_compounding: true           # If not logged, meta-learn won't extract patterns

---

## Part 9: When Alternatives Map Doesn't Exist

# If /foundation/brain.md Section 3 is missing or incomplete

missing_alternatives_handling:
  status: "SHOULD NOT RUN pmm-positioning"
  action: "Trigger alternatives-map skill first"

  message: |
    "Positioning requires alternatives anchor. No Section 3 found in brain.
     Building alternatives map now...
     (estimated 15 min)
     Then positioning will run with alternatives context loaded."

  dependency_gate:
    pmm_positioning_blocked_until: "brain.md Section 3 complete"
    prerequisite_skill: "alternatives-map"
    estimated_time: "15 min"

---

## Part 10: Template for Alternatives-Anchored Positioning

positioning_with_alternatives_template:
  target_buyer: "Mid-market ops leaders (from brain Section 2)"
  buyer_problem: "GTM complexity kills growth velocity"

  status_quo_option: "Continue with spreadsheets + Salesforce + Slack"
  status_quo_pain: "Manual data sync, no single source of truth, ops overhead"

  named_alternatives:
    - alternative_1: "Slack (unified communications)"
      your_differentiation: "Slack owns comms; you own GTM ops consolidation"
      positioning_angle_vs_this: "While Slack handles team comms, you consolidate all GTM data + workflows"

    - alternative_2: "Salesforce (CRM)"
      your_differentiation: "Salesforce owns CRM; you own GTM ops + integration"
      positioning_angle_vs_this: "Salesforce is sales-only; you integrate with Slack, Salesforce, marketing tools"

    - alternative_3: "Notion (operations hub)"
      your_differentiation: "Notion is generic; you're GTM-specific with built-in integrations"
      positioning_angle_vs_this: "Notion requires manual setup for each use case; you ship GTM-specific workflows"

  your_unique_positioning: |
    "Reduce go-to-market complexity by 40% via integration-native architecture.
     The only platform built specifically for GTM ops where data flows automatically
     across sales, marketing, CS, and finance — no spreadsheets, no manual sync."

  positioning_clarity_vs_each_alternative: 17/20
  assessment: "Owns unique angle (GTM ops + integration-native) vs. all competitors"

---

## Part 11: Pattern: When Positioning Needs Alternatives Context

positioning_maturity_model:
  level_1_no_alternatives:
    description: "Positioning exists but not validated against alternatives"
    score: <15
    action: "Load alternatives, re-score"

  level_2_alternatives_loaded:
    description: "Positioning validated vs. named alternatives; owns some angles"
    score: 15-17
    action: "Strengthen positioning to own more dimensions"

  level_3_owned_vs_all:
    description: "Positioning owns clear unique angle vs. all alternatives"
    score: 17-20
    action: "Ready to deploy; meta-learn will track win rate validation"

  level_4_validated:
    description: "Positioning owns unique angle AND win rate validates ownership (82%+)"
    score: 18-20
    pattern: "Confirmed (move to guardrail)"
    action: "Use as template for future GTM briefs in same segment"
