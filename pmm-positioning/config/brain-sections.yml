## Part 10: Sync Protocol (Keep Brain & Positioning Aligned)

sync_protocol:
  trigger_resync:
    when: "Section 2 (ICP) or Section 3 (Alternatives) updated"
    action: "Re-run pmm-positioning to refresh positioning with new context"
    user_prompt: "ICP changed. Revalidate positioning?"

  version_control:
    positioning_versioning: "Keep old positioning as archive (dated)"
    current_positioning: "Always in Section 5, updated with latest run"
    comparison: "pmm-positioning can show before/after to user"

  conflict_resolution:
    if_positioning_conflicts_with_alternatives: "User chooses: refresh positioning or keep old?"
    if_icp_changes_mid_cycle: "Option to revalidate positioning against new ICP"
