name: Something broke or gave the wrong answer
description: A skill, command or install step did not do what the README says.
labels: ["bug"]
body:
  - type: input
    id: skill
    attributes:
      label: Which skill or command?
      placeholder: competitive-battlecard
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Claude Code plugin marketplace
        - npx skills add
        - Copied the skill folders
        - Skill zip in Claude on the web or desktop
        - Cursor
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Repo version
      description: The newest heading in CHANGELOG.md you have, or the release tag.
      placeholder: v1.21.0
  - type: textarea
    id: asked
    attributes:
      label: What did you ask?
      description: Paste your prompt. Remove customer names and anything private.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: Did the wrong skill answer?
      description: If so, name the one you expected and the one that answered.
